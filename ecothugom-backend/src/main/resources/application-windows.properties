# Local development: authenticate as the Windows account running Java.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# TLS is encrypted; the local SQL Server certificate is trusted explicitly.
spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1435};databaseName=${DB_NAME:EcoThuGomDB};integratedSecurity=true;encrypt=true;trustServerCertificate=true;loginTimeout=5}

