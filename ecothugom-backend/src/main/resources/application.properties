spring.application.name=ecothugom-backend
spring.profiles.default=windows

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Bind/read LocalDateTime directly: DATETIME2 contains UTC wall-clock values, not a zone.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.sql.init.mode=never
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
# A fractional material ID must fail rather than silently truncate to another material.
spring.jackson.deserialization.accept-float-as-int=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie

# Opt-in local provisioning only; never store a bootstrap password in this file.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}

# Private evidence is served only by authenticated, order-scoped API handlers.
ecothugom.evidence-directory=${EVIDENCE_DIRECTORY:.local/evidence}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Public development routing; configure a private provider before broader deployment.
ecothugom.routing-url=${ROUTING_URL:https://valhalla1.openstreetmap.de/route}
ecothugom.routing-timeout-ms=${ROUTING_TIMEOUT_MS:15000}
ecothugom.routing-proxy-url=${ROUTING_PROXY_URL:}
